%YAML:1.0

# 2D trajectory window zoom, px per metre. 0.4 = 0.8x the 0.5 default, to fit
# run6's larger trajectory into the debug window.
visualizer:
  scale: 0.4

image_sequence:
  path: ../../../VO-datasets/odometry_log/run6/imgs0
  times_file: ../../../VO-datasets/odometry_log/run6/cam0_times.txt
  ground_truth_file: ../../../VO-datasets/odometry_log/run6/GLOBAL_POSITION_INT_log.csv
  start_time: 600.0
  end_time: 900.0
  # Altimeter scale: feed relative_alt (height above HOME, not terrain) as the
  # Homography plane distance d, so t = t_raw * d instead of consuming a GT
  # position delta. Only true AGL where the ground is at takeoff elevation --
  # terrain relief becomes a systematic scale error. Frames with AGL <= 0
  # (pre-takeoff) fall back to the GT-delta scale.
  altimeter_scale: 1

frontend: optical_flow
optical_flow:
  max_corners: 1000
  win_size: 21
  fb_error_threshold: 1.0

bucketing:
  enabled: 0
  grid_cols: 8
  grid_rows: 6
  max_features_per_bucket: 30

scale_estimator:
  type: AirSim

local_bundle_adjustment:
  enabled: 0

# Actual Kannala-Brandt fisheye intrinsics for this camera. The model owns
# undistortion and hands the pipeline the rectified pinhole intrinsics, so the
# old hand-computed fx/fy/cx/cy pinhole block is no longer needed.
camera:
  model_type: "KannalaBrandtCamera"
  scale_factor: 1.0
  image_width: 1280
  image_height: 720
  k2:  0.04620145
  k3: -0.03831710
  k4:  0.02262017
  k5: -0.01124080
  mu:  549.30287
  mv:  559.17020
  u0:  613.57787
  v0:  383.53130

# Nadir, near-planar scene -> Homography (Essential degenerates on a plane).
# Keep the value on its own line: OpenCV's YAML parser does NOT strip trailing
# inline comments from string values, so "Homography  # ..." is read literally
# and silently falls back to the Essential estimator.
pose_estimator:
  type: Homography


# cam0->body extrinsic for the nadir mount, same key/handling as the mun rosbag
# configs. Re-expresses the camera-frame VO pose at the body frame so the
# trajectory lands in the body/ENU frame. Seeded with the mun Bell412 nadir
# mount (Rz(~90deg) + small tilt); replace with run6's own calibration if it
# differs.
body_T_cam0: !!opencv-matrix
  rows: 4
  cols: 4
  dt: d
  data: [-0.01039363,  0.99994595,  0.00027614, -0.27939175,
         -0.99982944, -0.0103882,  -0.01527021,  0.00394073,
         -0.01526652, -0.00043481,  0.99988337, -0.00039529,
          0, 0, 0, 1]

system:
  backend: CPU
  num_threads: 12
  verbose: 0

keyframe:
  min_matches: 12
  max_skip: 40
