%YAML:1.0

visualizer:
    scale: 0.2      # px-per-metre zoom of the 2D trajectory window

rosbag:
  bag_path: ../../../VO-datasets/MUN-FRL/Bell412-3/bell412_dataset3.bag
  ppk_path: ../../../VO-datasets/MUN-FRL/Bell412-3/bell412_dataset3_frl.pos
  img_topic: /camera/image_mono
  gps_topic: /fix
  imu_topic: /imu/data
  start_time: 30.0           
  end_time: 300.0                 


detector:
  type: SIFT
  SIFT:
    nfeatures: 1000
    nOctaveLayers: 3
    contrastThreshold: 0.04
    edgeThreshold: 10
    sigma: 1.6

matcher:
  type: FLANN
  FLANN:
    kdTrees: 5
    searchChecks: 50
  distance_ratio: 0.75
  
bucketing:
  enabled: 1
  grid_cols: 8
  grid_rows: 6
  max_features_per_bucket: 30
 
local_bundle_adjustment:
  enabled: 1
  window_size: 10
  opt_stride: 2
  anchor_prior_sigma: 1e-4
  end_prior_rot_sigma: 0.03
  end_prior_trans_sigma: 3.0
  between_rot_sigma: 0.03
  between_trans_sigma: 1.5
  stationary_rot_sigma: 0.03
  stationary_trans_sigma: 1.5
  pixel_sigma: 1.5
  rank_tolerance: 1.0e-5
  outlier_threshold: 4.0
  min_observations: 4
  min_bbox_diagonal: 25.0
  min_smart_factors: 30
  max_correction_translation: 5.0
  max_correction_rotation_deg: 5.0

body_T_cam0: !!opencv-matrix
  rows: 4
  cols: 4
  dt: d
  data: [-0.01039363,  0.99994595,  0.00027614, -0.27939175,
         -0.99982944, -0.0103882,  -0.01527021,  0.00394073,
         -0.01526652, -0.00043481,  0.99988337, -0.00039529,
          0, 0, 0, 1]

camera:
  model_type: "KannalaBrandtCamera"
  scale_factor: 0.5
  image_width: 1440
  image_height: 1080
  k2: -0.0764245
  k3:  0.0322856
  k4: -0.0445168
  k5:  0.0163317
  mu:  829.224
  mv:  829.454
  u0:  833.937
  v0:  562.509

pose_estimator:
  type: Homography
  altimeter_scale: 0

system:
  backend: CPU
  num_threads: 12
  verbose: 0
  

aligner:
  init_distance: 10.0   # GT travel (m) before the VO->GT yaw is solved

keyframe:
  min_matches: 12
  max_skip: 40
