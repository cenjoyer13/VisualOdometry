%YAML:1.0

rosbag:
  bag_path: /data/flight.bag
  img_topic: /camera/image_mono
  gps_topic: /fix
  imu_topic: /imu/data
  ppk_path: /data/flight.pos   
  start_time: 30.0           
  end_time: 300.0                 


detector:
  type: SIFT
  SIFT:
    nfeatures: 1000
    nOctaveLayers: 3
    contrastThreshold: 0.04
    edgeThreshold: 10
    sigma: 1.6

matcher:
  type: FLANN
  FLANN:
    kdTrees: 5
    searchChecks: 50
  distance_ratio: 0.75
  
bucketing:
  enabled: 1
  grid_cols: 6
  grid_rows: 3
  max_features_per_bucket: 70
 
local_bundle_adjustment:
  enabled: 1
  window_size: 10 

system:
  backend: CPU
  num_threads: 12
  verbose: 0
