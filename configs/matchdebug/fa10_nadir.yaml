%YAML:1.0

# MatchDebugger config for the fa10_2026-07-23 Homebrew capture, nadir camera
# (imgs0). Only the detector / matcher / bucketing / camera / system blocks and
# image_sequence.path are read by MatchDebugger -- the pose/LBA/scale keys of
# the full schema are irrelevant here and left out.
#
# Detector and matcher can be swapped from the CLI without editing this file:
#   ./MatchDebugger ../configs/matchdebug/fa10_nadir.yaml --detector SIFT --matcher FLANN
#
# Run from build/ so SuperPoint's hard-coded models/superpoint.onnx resolves.

image_sequence:
  path: ../../../VO-datasets/Homebrew/fa10_2026-07-23/imgs0

detector:
  type: SuperPoint

# Kinematic = brute-force BF + Lowe ratio test + pixel-jump gate. The gate
# defaults to 80 px, which is tuned for adjacent frames -- raise max_pixel_jump
# when rendering pairs with a large --gap or it will silently cut real matches.
matcher:
  type: Kinematic
  distance_ratio: 0.75

bucketing:
  enabled: 0
  grid_cols: 8
  grid_rows: 6
  max_features_per_bucket: 30

# Nadir camera calibration from the dataset readme (Kannala-Brandt fisheye).
# The model owns undistortion; MatchDebugger applies it to both frames before
# detection, exactly as the evaluators do. --no-undistort skips it to see the
# raw fisheye correspondences.
camera:
  model_type: "KannalaBrandtCamera"
  scale_factor: 1.0
  image_width: 1280
  image_height: 720
  k2:  0.04620145
  k3: -0.03831710
  k4:  0.02262017
  k5: -0.01124080
  mu:  549.30287
  mv:  559.17020
  u0:  613.57787
  v0:  383.53130

system:
  backend: CUDA
  num_threads: 12
  verbose: 0
