%YAML:1.0

# MatchDebugger config for the fa10_2026-07-23 Homebrew capture, FRONT-FACING
# camera (imgs1). SuperPoint + Kinematic (BF + ratio + pixel-jump).
#
# Verification model: pass --verify f. The front camera looks at a scene with
# real depth spread, so a homography is the wrong model and would reject
# perfectly good matches wherever parallax separates near from far structure.
# The nadir configs keep the homography default because that scene is planar.
#
#   ./MatchDebugger ../configs/matchdebug/fa10_front.yaml --layout stack --verify f
#
# Run from build/ so SuperPoint's hard-coded models/superpoint.onnx resolves.

image_sequence:
  path: ../../../VO-datasets/Homebrew/fa10_2026-07-23/imgs1

detector:
  type: SuperPoint

matcher:
  type: Kinematic
  distance_ratio: 0.75

bucketing:
  enabled: 0
  grid_cols: 8
  grid_rows: 6
  max_features_per_bucket: 30

# Front camera calibration from the dataset readme. NOTE: PinholeCamera carries
# intrinsics and the scale_factor resize only -- it does NOT apply k1/k2/p1/p2,
# and CameraModelConfig has no fields for them, so this block is effectively a
# pass-through for the image. The readme's distortion is small (k1 ~7.5e-3),
# but the tangential p2 ~1.0e-2 does bend the image edges; treat point
# positions near the frame border as slightly off if you measure from them.
camera:
  model_type: "Pinhole"
  scale_factor: 1.0
  image_width: 1280
  image_height: 720
  mu: 730.62376470
  mv: 746.08997255
  u0: 620.42578092
  v0: 370.82770459

system:
  backend: CUDA
  num_threads: 12
  verbose: 0
