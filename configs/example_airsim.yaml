%YAML:1.0
# Example odometry config for the AirSim-based targets
# (FreeplayDrone, PathRecorder, PathPlayer).
#
# Tune the camera block to match the AirSim camera you're capturing from.
# The defaults below assume a 640x480 front camera with a 90 deg horizontal FOV.

camera:
  fx: 320.0
  fy: 320.0
  cx: 320.0
  cy: 240.0

detector:
  type: SIFT
  SIFT:
    nfeatures: 1500
    nOctaveLayers: 3
    contrastThreshold: 0.04
    edgeThreshold: 10
    sigma: 1.6

matcher:
  type: FLANN
  distance_ratio: 0.75
  FLANN:
    kdTrees: 5
    searchChecks: 50

bucketing:
  enabled: 1
  grid_cols: 6
  grid_rows: 4
  max_features_per_bucket: 60

local_bundle_adjustment:
  enabled: 1
  window_size: 10
  opt_stride: 2

system:
  backend: CPU      # set to CUDA to use ONNX RT's CUDA EP (if your install supports it)
  num_threads: 8
  verbose: 0        # set to 1 (or pass --debug on the CLI) for LBA correction logs

# AirSim-specific extras consumed by PathPlayer:
airsim:
  playback_velocity: 3.0
