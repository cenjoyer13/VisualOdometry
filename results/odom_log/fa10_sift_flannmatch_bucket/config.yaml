%YAML:1.0

visualizer:
    scale: 0.5      # px-per-metre zoom of the 2D trajectory window

image_sequence:
  path: ../../../VO-datasets/odometry_log/fa10_16.07/imgs1
  times_file: ../../../VO-datasets/odometry_log/fa10_16.07/cam1_times.txt
  start_time: 390.0
  end_time: -1.0    # < 0 = unbounded (whole log)

scale_estimator:
  type: Unit
  step: 1.0

pose_estimator:
  type: Essential

camera:
  fx: 762.7223
  fy: 772.0225
  cx: 640.0
  cy: 360.0

detector:
  type: SIFT
  SIFT:
    nfeatures: 1000
    nOctaveLayers: 3
    contrastThreshold: 0.02
    edgeThreshold: 10
    sigma: 1.6

matcher:
  type: FLANN
  FLANN:
    kdTrees: 5
    searchChecks: 50
  distance_ratio: 0.75

bucketing:
  enabled: 1
  grid_cols: 8
  grid_rows: 6
  max_features_per_bucket: 30

# No metric scale source (no GT, see scale_estimator above) -> LBA's metric
# sigmas would be meaningless against the arbitrary-unit Unit scale.
local_bundle_adjustment:
  enabled: 0

system:
  backend: CPU
  num_threads: 12
  verbose: 0

keyframe:
  min_matches: 12
  max_skip: 40
